---
- name: Configurar servidor web con Nginx
  hosts: webservers
  become: true

  tasks:

    - name: Actualizar caché de apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar Nginx
      apt:
        name: nginx
        state: present

    - name: Iniciar y habilitar Nginx al arranque
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Desplegar página web personalizada
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Recargar Nginx

    - name: Verificar que Nginx responde (desde la VM)
      uri:
        url: http://localhost
        return_content: yes
        status_code: 200
      register: resultado

    - name: Mostrar resultado de la verificación
      debug:
        msg: "✅ Nginx responde correctamente. Tamaño de respuesta: {{ resultado.content | length }} bytes"

  handlers:
    - name: Recargar Nginx
      service:
        name: nginx
        state: reloaded
